kind = "web"
previewPath = "/"
title = "Medi Care Manager"
version = "1.0.0"
id = "artifacts/medi-care"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18741

[services.development]
run = "pnpm --filter @workspace/medi-care run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medi-care", "run", "build" ]
publicDir = "artifacts/medi-care/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18741"
BASE_PATH = "/"
