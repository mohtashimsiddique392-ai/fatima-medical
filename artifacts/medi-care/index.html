<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fatima Medical Store - Pharmacy at your fingertips</title>
    <meta name="description" content="Fatima Medical Store - Order medicines online in Lucknow. UPI, COD, family records, referral rewards." />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#14b8a6" />
    <meta name="application-name" content="Fatima Medical" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Medicos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      /* Kill old service workers */
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(r) {
          for (var sw of r) sw.unregister();
        });
        caches.keys().then(function(n) {
          for (var c of n) caches.delete(c);
        });
      }
      /* Catch ALL JS errors and show them on screen */
      window.onerror = function(msg, src, line, col, err) {
        document.getElementById('root').innerHTML =
          '<div style="padding:24px;font-family:sans-serif;max-width:500px;margin:40px auto;">' +
          '<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:12px;padding:20px;">' +
          '<h2 style="color:#dc2626;margin:0 0 12px">JS Error</h2>' +
          '<p style="margin:0 0 8px;font-weight:bold;word-break:break-all">' + msg + '</p>' +
          '<p style="margin:0;color:#666;font-size:13px">' + src + ' line ' + line + '</p>' +
          '</div></div>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:24px;font-family:sans-serif;max-width:500px;margin:40px auto;">' +
          '<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:12px;padding:20px;">' +
          '<h2 style="color:#dc2626;margin:0 0 12px">Promise Error</h2>' +
          '<p style="margin:0;word-break:break-all">' + e.reason + '</p>' +
          '</div></div>';
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#999;font-size:14px;">
        Starting app...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
